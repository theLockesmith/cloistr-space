stages:
  - test
  - build
  - smoke
# NOTE: No deploy stage - ArgoCD handles image updates automatically

variables:
  NODE_VERSION: "22"

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/frontend-smoke.yml'

# Test and type-check
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  timeout: 15 minutes
  variables:
    CI: "true"
  before_script:
    # jsdom requires native dependencies on Alpine
    - apk add --no-cache python3 make g++
    - corepack enable && corepack prepare pnpm@10.29.3 --activate
    - echo "//git.aegis-hq.xyz/api/v4/projects/44/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    - pnpm typecheck
    - pnpm test:unit
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .pnpm-store/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# Build container image via the shared template (runs on default branch +
# merge_request + renovate/* so Renovate MRs get a green build+smoke pipeline
# and can auto-merge; pushes :latest only on the default branch). NPM_TOKEN
# build-arg passed via KANIKO_EXTRA_FLAGS. CI_REGISTRY_IMAGE already resolves to
# registry.aegis-hq.xyz/coldforge/cloistr-space.
build:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_EXTRA_FLAGS: "--build-arg=NPM_TOKEN=${CI_JOB_TOKEN}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\// && $CI_OPEN_MERGE_REQUESTS == null'

# Smoke-test gate: load built image in real Chromium, fail on console errors /
# blank page. Uses the template default SMOKE_IMAGE ($CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA),
# which matches the :<short-sha> tag .kaniko-build now pushes.
smoke-test:
  extends: .smoke-test
  needs: ["build"]
